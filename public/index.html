<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Общий чат</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <main>
    <h1>Общий чат</h1>
    <form id="login">
      <label for="name">Имя</label>
      <div class="row"><input id="name" maxlength="30" required autocomplete="nickname"><button id="connect">Подключиться</button></div>
    </form>
    <div class="toolbar">
      <span id="status" role="status" data-state="offline">Отключено</span>
      <span>Участников: <span id="count">—</span></span>
      <button id="reconnect" type="button" hidden>Подключиться снова</button>
      <button id="disconnect" type="button" disabled>Отключиться</button>
    </div>
    <p id="notice" role="alert"></p>
    <section id="messages" role="log" aria-label="Сообщения чата" aria-live="polite"><p id="empty">Нет сообщений</p></section>
    <form id="composer"><label for="text">Сообщение</label><div class="row"><input id="text" maxlength="1000" disabled required autocomplete="off"><button id="send" disabled>Отправить</button></div></form>
    <details><summary>События WebSocket</summary><ol id="events" aria-label="Журнал событий"></ol></details>
  </main>
</body>
</html>
